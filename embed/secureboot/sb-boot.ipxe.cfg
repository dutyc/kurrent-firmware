#!ipxe

# Secure Boot runtime configuration (EMBED, covered by the EFI signature).
# Static policy lives here; only device-specific data is fetched at runtime.

set controller_ip @CONTROLLER_EXPR@

# Fixed boot HTTPS endpoint: certificate must chain to the embedded boot CA.
# The port is baked into this image by build-sb.sh.
set https-port @BOOT_HTTPS_PORT@
set https-url https://${controller_ip}:${https-port}/

# Secure Boot key enrollment gate.  While the control plane has a
# registration window open, /boot/phase returns a script that runs
# sbenroll, reports the result and reboots.  When the window is closed
# the body is empty and boot continues.  The trailing || keeps a fetch
# failure from aborting the boot.
chain --autofree ${https-url}boot/phase ||

# Data-plane address and iSCSI defaults (unchanged from the L1 config).
set storager-ip ${controller_ip}
set base-iqn iqn.2026-07.com.controller
set iscsi-sep :::1:
isset ${hostname} && set initiator-iqn ${base-iqn}:${hostname} || set initiator-iqn ${base-iqn}:${mac}

# Identity: the attestation key lives in the TPM.  akgen is idempotent and
# runs inside signed code every boot; akpub publishes ak-public / ak-name /
# ak-type plus the Secure Boot state as the "sb" setting.  Without a TPM the
# commands fail, the report carries no AK and the control plane rejects the
# device as no_tpm.
akgen || echo "identity: attestation key error"

akpub || goto report-fingerprint
chain --autofree ${https-url}devices/report?mac=${netX/mac}&uuid=${uuid}&manufacturer=${manufacturer}&product=${product}&serial=${serial}&cpumodel=${cpumodel}&mem-total=${mem-total}&mem-type=${mem-type}&mem-speed=${mem-speed}&chip=${netX/chip}&busid=${netX/busid}&ak_public=${ak-public}&ak_name=${ak-name}&ak_type=${ak-type}&sb=${sb} ||
goto report-done

# Report without an identity so that the device is recorded as no_tpm; the
# fingerprint is still merged.
:report-fingerprint
chain --autofree ${https-url}devices/report?mac=${netX/mac}&uuid=${uuid}&manufacturer=${manufacturer}&product=${product}&serial=${serial}&cpumodel=${cpumodel}&mem-total=${mem-total}&mem-type=${mem-type}&mem-speed=${mem-speed}&chip=${netX/chip}&busid=${netX/busid}&sb=${sb} ||

:report-done

# Challenge: the control plane issues a one-shot nonce, the TPM quotes PCR
# 0/2/4/7 over it, and /boot-vars verifies the quote before releasing keys.
:challenge
chain --autofree ${https-url}devices/challenge?mac=${mac} && goto quoted || goto bootvars

:quoted
quote ${nonce} || goto bootvars
chain --autofree ${https-url}boot-vars?mac=${mac}&hostname=${hostname}&nonce=${nonce}&quote=${quote}&quote_sig=${quote-sig} || goto retry
goto vars-done

# One retry with the same nonce and quote, for a transient HTTPS or TLS
# failure before the request was processed.
:retry
echo "boot-vars: retrying once"
chain --autofree ${https-url}boot-vars?mac=${mac}&hostname=${hostname}&nonce=${nonce}&quote=${quote}&quote_sig=${quote-sig} || goto bootvars
goto vars-done

# Degraded path (challenge failed): no proof, so no credentials are released.
:bootvars
chain --autofree ${https-url}boot-vars?mac=${mac}&hostname=${hostname} || goto vars-done

:vars-done
isset ${iscsi-sep} || set iscsi-sep :::1:
isset ${hostname} && set initiator-iqn ${base-iqn}:${hostname} || set initiator-iqn ${base-iqn}:${mac}
